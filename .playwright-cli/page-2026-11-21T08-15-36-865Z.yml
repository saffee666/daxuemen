      - heading "叠加逻辑" [level=1] [ref=f4e35]
      - paragraph [ref=f4e36]:
        - text: 优惠能不能叠，答案大多
        - strong [ref=f4e37]: 不在攻略里，在官方条款里
        - text: 。这一页只做结构化引用：法规怎么算、品牌条款怎么限、各条目核对到的注记是什么。
        - strong [ref=f4e38]: 冲突的口径并列披露，不替你裁决
        - text: ；最终以结算页实付价为准。
      - generic [ref=f4e39]:
        - heading "01 · 四条总原则" [level=2] [ref=f4e40]
        - list [ref=f4e41]:
          - listitem [ref=f4e42]:
            - strong [ref=f4e43]: 只比结算页实付价。
            - text: 无论叠几层，最后看付款金额——「先涨价后补贴」就是要防这个。
          - listitem [ref=f4e44]:
            - strong [ref=f4e45]: 政府现金补贴与企业让利通常不互斥。
            - text: 国补按「减去所有优惠后的最终售价」计算，天然叠在商家优惠之上（法规原文见 02）。
          - listitem [ref=f4e46]:
            - strong [ref=f4e47]: 平台券看条款。
            - text: 「不可与直降/特价叠加」是常见限制，以结算页实际可勾选为准。
          - listitem [ref=f4e48]:
            - strong [ref=f4e49]: 国补看品类目录与资格次数。
            - text: 每类商品资格全国仅 1 次（含线上线下），跨省领过就没了。
      - generic [ref=f4e50]:
        - heading "02 · 国补怎么算（法规原文）" [level=2] [ref=f4e51]
        - blockquote [ref=f4e52]:
          - text: 「每件补贴比例为
          - strong [ref=f4e53]: 减去生产、流通环节及移动运营商所有优惠后
          - text: 最终销售价格的 15％，每件最高不超过 500 元。」
          - generic [ref=f4e54]: —— 商务部等 5 部门《手机、平板、智能手表（手环）购新补贴实施方案》（2025-01）
        - list [ref=f4e55]:
          - listitem [ref=f4e56]:
            - text: 2026 年起扩至 4 类数码（新增智能眼镜等），
            - strong [ref=f4e57]: 每人每类可补贴 1 件
            - text: ，价格须备案并显著标明「初始价 / 商家让利 / 补贴额 / 最终价」，不得「先涨价后补贴」。
          - listitem [ref=f4e58]:
            - strong [ref=f4e59]: 资格全国互斥
            - text: ：每类商品补贴资格全国（含线上线下）仅限使用 1 次；已在其他省市领用过的，无法再领（北京市实施细则口径）。
          - listitem [ref=f4e60]: 申领人、付款人、收货人须一致（各平台国补规则通用条款）。
