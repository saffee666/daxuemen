      - generic [ref=f2e57]:
        - generic [ref=f2e58]:
          - heading "怎么用" [level=2] [ref=f2e59]
          - paragraph [ref=f2e60]: 三步全是单选/多选，选完出清单。清单按「阶段符合 + 地区能对上 + 场景命中」三个条件筛——是初筛，不是资格审定。
        - generic [ref=f2e61]:
          - heading "结果怎么解读" [level=2] [ref=f2e62]
          - paragraph [ref=f2e63]: 每张卡片带了核对日期与可信度标：可信「高」=直达具体文件页，「中」=只到门户。先点开一两张最贴近你情况的，读「我符合吗」那一段，再顺官方链接核对。
        - generic [ref=f2e64]:
          - heading "注意事项与局限" [level=2] [ref=f2e65]
          - paragraph [ref=f2e66]: 城市维度只覆盖我们已核对建条目的城市；「还不确定」按全国通用口径筛，会漏掉仅限个别城市的条目。条目库每月巡检一次，当月新政策可能未入库。本工具只整理公开信息，不构成申请建议。
