      - generic [ref=f1e38]: 校内办事找谁：部门职能地图
    - generic [ref=f1e39]:
      - article [ref=f1e40]:
        - generic [ref=f1e41]:
          - generic [ref=f1e42]:
            - generic [ref=f1e43]: 在校
            - generic [ref=f1e44]: ④ 避坑
            - generic [ref=f1e45]: ⑥ 生活
            - generic [ref=f1e46]: 更新 2026-11
          - heading "校内办事找谁：部门职能地图" [level=1] [ref=f1e47]
          - paragraph [ref=f1e48]: 教务处/学工部/团委/信息办/就业中心/辅导员各管什么——第一次办事直接找对门
        - generic [ref=f1e49]:
          - paragraph [ref=f1e50]:
            - text: 大学里多数跑空和「没人告诉我」，不是流程难，是
            - strong [ref=f1e51]: 找错了门
            - text: 。这张地图按部门列职能——办事前对号入座，第一次就去对的地方。各校部门名称略有差异（学生处/学工部、教务处/教务部），职能基本一致。
          - heading "教务处（课程与成绩的门）" [level=2] [ref=f1e52]
          - paragraph [ref=f1e53]:
            - text: 管：选课退课、培养方案、转专业与辅修政策、缓考补考、成绩与绩点证明、四六级/计算机等级考试报名、保研政策文件。 找它：对课程安排有异议、要开成绩单/在读证明、想转专业先查当年政策——政策文件在官网「教务通知」栏，每年更新，
            - strong [ref=f1e54]: 以当年文件为准
            - text: 。
          - heading "图书馆（不止借书）" [level=2] [ref=f1e55]
          - paragraph [ref=f1e56]: 管：纸质与电子资源（知网等数据库的校内入口）、研讨间/座位预约、信息检索培训。 找它：论文要查数据库时先来这——校外访问入口（VPN/WEBVPN）也归信息办和图书馆共管，查找「校外访问」指南。
          - heading "学生工作部 / 学生处（奖助与生活支持的门）" [level=2] [ref=f1e57]
          - paragraph [ref=f1e58]:
            - text: 管：奖学金评定与助学金、困难认定与助学贷款、勤工助学岗位、宿舍调配与住宿规定、心理支持转介。 找它：奖助学金评定有异议、家庭情况变化需要困难认定、想申请勤工助学——困难认定每年集中受理一次，
            - strong [ref=f1e59]: 错过窗口等一年
            - text: ，家庭情况突变时第一时间联系辅导员插报。
          - heading "校团委 / 学生会（活动与评优的门）" [level=2] [ref=f1e60]
          - paragraph [ref=f1e61]: 管：评优评先（三好/优干）、志愿服务时长、社会实践与科创竞赛立项、社团管理与活动审批。 找它：综合测评加分有疑问、想立项科创/实践项目、报志愿时长——综测细则各校不同，先拿到本校文件再对照规划。
          - heading "信息办 / 网络中心（账号与正版的门）" [level=2] [ref=f1e62]
          - paragraph [ref=f1e63]:
            - text: 管：校园网账号与上网、统一身份认证（一卡通/门禁/系统的账号底座）、正版软件平台（Windows/Office/杀毒的校内免费授权）、邮箱开通。 找它：校园网连不上、统一身份认证密码忘了、想知道学校买了哪些正版软件——
            - strong [ref=f1e64]: 很多学生到毕业都不知道学校正版软件平台里有什么
            - text: ，入学时去翻一次。
          - heading "就业指导中心（大三大四的主场）" [level=2] [ref=f1e65]
          - paragraph [ref=f1e66]: 管：招聘宣讲信息、就业协议与三方、选调生/基层项目政策传达、简历与面试辅导、毕业生档案去向。 找它：大三起每年去两趟——宣讲会日历和基层项目通知从这里发；三方协议的签约流程与违约条款先问清楚再签。
          - heading "辅导员：万能联系人" [level=2] [ref=f1e67]
          - paragraph [ref=f1e68]:
            - text: 辅导员不是职能部门，是
            - strong [ref=f1e69]: 所有你没搞清楚「该找谁」时的第一站
            - text: ：他未必亲自办，但知道流程、能帮你指门、能在你错过窗口时帮你插报（困难认定、紧急补助这类）。经验法则：拿不准找谁，先发辅导员一条消息，比自己在官网翻一小时快。
          - heading "官网导航法：一站式入口" [level=2] [ref=f1e70]
          - paragraph [ref=f1e71]: 以上部门集中在两个入口：学校官网的「机构设置/部门导航」栏（各部门官网链接），和「网上服务大厅/一站式办事平台」（线上办事流程）。新生开学第一周做一遍：把教务处、学工部、就业中心、信息办四个部门的官网加进浏览器书签——大学四年的通知都从这几个口发出。
          - separator [ref=f1e72]
          - paragraph [ref=f1e73]: 来源与改编说明：本文职能框架改编自 Ac-Wiki《学生信息资源》（ac-wiki.org，CC BY 4.0），按全国通用口径改写；各校部门设置以其官网为准。
