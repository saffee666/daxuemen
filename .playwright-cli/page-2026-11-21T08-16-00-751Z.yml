          - heading "怎么用" [level=2] [ref=f6e59]
          - paragraph [ref=f6e60]: 四道单选，答完出推荐与计分明细。推荐是「按你的答案，哪条路在框架里分更高」，不是「你必须走哪条」——家里人、对象、身体这些题目外的权重，框架不管，你自己加。
        - generic [ref=f6e61]:
          - heading "结果怎么解读（评分规则全公开）" [level=2] [ref=f6e62]
          - paragraph [ref=f6e63]: 行当：互联网→头部城市；体制内→回老家；专业技术→新一线；没想好→各记 0.5 分新一线。预算：3000 内→回老家；3000–5000→新一线；5000 上→头部城市。家庭：托不了底→回老家；互相不添负担→新一线；家里盼回→回老家。活法：拼上限→头部城市；求稳→新一线。四个方向分数最高者为推荐，平分时按「新一线 > 头部 > 老家」排序——它最不吃答案组合。
        - generic [ref=f6e64]:
