      - paragraph [ref=f2e40]: 钱条目进站前必须答满四问，字段一一对应：
      - generic [ref=f2e41]:
        - generic [ref=f2e42]:
          - term [ref=f2e43]: 谁能用
          - definition [ref=f2e44]: 领取条件写成可判断的句子；模糊条件列出官方认定口径
        - generic [ref=f2e45]:
          - term [ref=f2e46]: 怎么认证
          - definition [ref=f2e47]: 步骤从「去哪」到「到账」一步一个动作；材料按官方清单；企业优惠标注认证渠道
        - generic [ref=f2e48]:
          - term [ref=f2e49]: 什么时候最划算
          - definition [ref=f2e50]: 截止日期结构化（日历可订阅），叠加规则只引官方口径
        - generic [ref=f2e51]:
          - term [ref=f2e52]: 有没有坑
          - definition [ref=f2e53]: 风险标签逐条能在正文找到依据，不发明
      - paragraph [ref=f2e54]: 道条目（避坑/学习/生活/开源挣钱）答三问：坑在哪、正确姿势、什么时间点。
