  - main [ref=f3e32]:
    - generic [ref=f3e33]:
      - paragraph [ref=f3e34]: 关于 · 目录方法论
      - heading "记录怎么变成条目。" [level=1] [ref=f3e35]
      - paragraph [ref=f3e36]:
        - text: 站上每一条都不是「抓来的」，是
        - strong [ref=f3e37]: 核出来的
        - text: 。这页写清整条流水线：数据从哪来、走什么工序进站、怎么分类、多久更新一次——让「最后核对」四个字有据可查。
    - generic [ref=f3e38]:
      - heading "一、数据从哪来（三个入口）" [level=2] [ref=f3e39]
      - list [ref=f3e40]:
        - listitem [ref=f3e41]:
          - strong [ref=f3e42]: 官方一手源
          - text: ：教育部全国政策清单、各市人社局官网与公众号、学校资助中心/教务处通知、品牌官方活动页。
        - listitem [ref=f3e43]:
          - strong [ref=f3e44]: 聚合源交叉
          - text: ：同类聚合站（补贴速查/学生优惠站）作为线索与对账源——只当线索，
          - strong [ref=f3e45]: 每条回官方原文复核后才入库
          - text: ，复核不了的标「待复核」。
        - listitem [ref=f3e46]:
          - strong [ref=f3e47]: 用户爆料
          - text: ：条目页「纠错/爆料」入口直达 Issue 表单；爆料通常触发对应条目提前复核。
    - generic [ref=f3e48]:
      - heading "二、一条记录怎么变成条目" [level=2] [ref=f3e49]
      - list [ref=f3e50]:
        - listitem [ref=f3e51]:
          - strong [ref=f3e52]: 草稿
          - text: ：按四问（谁能用/怎么认证/什么时候最划算/有没有坑）落字段，官方链接+核对日期必填。
        - listitem [ref=f3e53]:
          - strong [ref=f3e54]: 核对
          - text: ：人工回官方原文逐项抄——金额、资格、入口、日期；不自动抓取入库。
        - listitem [ref=f3e55]:
          - strong [ref=f3e56]: 发布
          - text: ：过发布硬约束（无官方入口不发、纯经验帖双源不发、不编造数据）。
        - listitem [ref=f3e57]:
          - strong [ref=f3e58]: 变更/过期
          - text: ：政策变了标「已变更」并写差异；过期标「已过期」保留供回溯，不删除。
      - paragraph [ref=f3e59]: 分类不是随手打的标签：全站条目按 43 个标准类目归档（按支柱分词表），分类写错会被构建期校验直接拦下——坏数据进不了站。
    - generic [ref=f3e60]:
      - heading "三、更新节奏" [level=2] [ref=f3e61]
      - list [ref=f3e62]:
        - listitem [ref=f3e63]:
          - strong [ref=f3e64]: 月度巡检
          - text: ：脚本扫描全部条目的核对日期，超期自动打徽标。
        - listitem [ref=f3e65]:
          - strong [ref=f3e66]: 申报窗口驱动
          - text: ：官方补贴按申报窗口核对，不受日历约束。
        - listitem [ref=f3e67]:
          - strong [ref=f3e68]: 来源页监控
          - text: ：政策页变化走「网页 diff 监控 → 变更开单」流程，机器盯变化、人做核对。
        - listitem [ref=f3e69]:
          - strong [ref=f3e70]: 你也是传感器
          - text: ：
          - link "纠错日志" [ref=f3e71] [cursor=pointer]:
            - /url: /corrections
          - text: 里每条已修正记录，起点都是有人发现「跟官方对不上」。
    - generic [ref=f3e72]:
      - heading "四、边界声明" [level=2] [ref=f3e73]
      - paragraph [ref=f3e74]:
        - text: 本站是非官方信息整理：内容覆盖已核对的部分，
        - strong [ref=f3e75]: 不穷尽所有资助与优惠
