          - paragraph [ref=f2e48]: 「付费内推」多是皮包公司甚至纯骗局——收钱后给一份假 offer 或直接拉黑；「押金/保证金」入职后以各种理由不退；更危险的变种是把付费包装成「先培训后上岗」，诱导签培训贷（见 [培训贷与校园贷识别](../pits-10-peixun-dai-xiaoyuandai/)）。共同话术：名额紧张制造紧迫感、承诺「不满意全额退」（跑路后无处退）
