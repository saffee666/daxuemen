                - listitem [ref=f2e97]: 《劳动合同法》第九条（用人单位不得要求提供担保或收取财物）（官方）
              - paragraph [ref=f2e98]: 信息来源：国家反诈中心 / 《劳动合同法》；备注：与兼职押金（[兼职防骗](../pits-04-jianzhi-fangpian/)）同源不同场景：兼职押金发生在干活后，假实习收费发生在入职前。
          - generic [ref=f2e99]:
            - generic [ref=f2e100]:
              - generic [aria-hidden] [ref=f2e101]: ✎
              - heading "补充说明" [level=2] [ref=f2e102]
            - generic [ref=f2e104]:
              - paragraph [ref=f2e105]:
                - text: 假实习收费的剧本：先给一个「大厂实习」钩子，再用「名额只剩最后一个」制造紧迫，收钱后给的是假 offer、永远「next batch」的入职通知，或直接失联。判据只有一条：
                - strong [ref=f2e106]: 正规单位招实习生不收钱，收钱的全是把实习当生意做的人
                - text: 。
              - paragraph [ref=f2e107]:
                - text: 真内推长什么样：在职员工实名推荐、流程走企业官方招聘系统、全程零收费。凡是把「内推」明码标价的，无论包装成「服务费」「合作分成」还是「退款保证」，一律按诈骗处理。已经交钱的，先留好转账记录与聊天记录，按
                - link "被骗后的黄金止损流程" [ref=f2e108] [cursor=pointer]:
                  - /url: ../pits-20-beipian-huangjin-zhisun/
                - text: 判断是否已达报警标准；机构还在的走
                - link "培训机构跑路退费" [ref=f2e109] [cursor=pointer]:
                  - /url: ../pits-29-peixun-jigou-paolu-tuifei/
                - text: 的追偿路径。
