              - heading "适用场景" [level=2] [ref=f2e69]
            - paragraph [ref=f2e71]: 找实习时刷到「付费内推」「保 offer」「名企实习名额」，或入职前被要求交押金、服装费、档案保管费
          - generic [ref=f2e72]:
            - generic [ref=f2e73]:
              - generic [aria-hidden] [ref=f2e74]: "02"
              - heading "核心坑" [level=2] [ref=f2e75]
            - paragraph [ref=f2e77]: 「付费内推」多是皮包公司甚至纯骗局——收钱后给一份假 offer 或直接拉黑；「押金/保证金」入职后以各种理由不退；更危险的变种是把付费包装成「先培训后上岗」，诱导签培训贷（见 [培训贷与校园贷识别](../pits-10-peixun-dai-xiaoyuandai/)）。共同话术：名额紧张制造紧迫感、承诺「不满意全额退」（跑路后无处退）
          - generic [ref=f2e78]:
            - generic [ref=f2e79]:
              - generic [aria-hidden] [ref=f2e80]: "03"
              - heading "正确姿势" [level=2] [ref=f2e81]
            - paragraph [ref=f2e83]: 记死三条——①正规实习不收费：《劳动合同法》第九条明确用人单位不得要求提供担保或收取财物，任何名目的入职收费都违法；②「内推」只信熟人实名内推与官方渠道（校就业中心、企业官网校招页），第三方「内推机构」一律当诈骗处理；③付费前两查——企查查/天眼查看企业资质与涉诉记录、签约看主体名称与退款条款。已交费先书面催讨，机构消失按 [培训机构跑路退费](../pits-29-peixun-jigou-paolu-tuifei/) 追偿
          - generic [ref=f2e84]:
            - generic [ref=f2e85]:
              - generic [aria-hidden] [ref=f2e86]: "04"
              - heading "关键时间" [level=2] [ref=f2e87]
            - paragraph [ref=f2e89]: 以学校当年通知为准；关键节点通常集中在开学、期末和毕业季。
          - generic [ref=f2e90]:
